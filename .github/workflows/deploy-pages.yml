name: Deploy Alma Tennis Academy to GitHub Pages

on:
  push:
    branches: [claude/alma-tennis-ecommerce-dro81]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: alma-tennis-academy/package-lock.json

      - name: Install dependencies
        working-directory: alma-tennis-academy
        run: npm ci

      - name: Build
        working-directory: alma-tennis-academy
        run: npm run build
        env:
          PUBLIC_URL: /test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: alma-tennis-academy/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
